name: CI/CD
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Only main publishes: a run from another branch would overwrite the version
  # tag a deploy pins (or the rollback tag). Bump the version to publish again.
  create-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - id: package_version
        run: echo "VERSION=$(node -p "require('./blitzbrowser/package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/tags/${{ steps.package_version.outputs.VERSION }}',
                sha: context.sha
              })
            } catch (e) {
              if (e.status !== 422) throw e
              const { data } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/${{ steps.package_version.outputs.VERSION }}',
              })
              if (data.object.sha !== context.sha) {
                core.setFailed('Tag ${{ steps.package_version.outputs.VERSION }} already points at ' + data.object.sha + '. Bump blitzbrowser/package.json version instead of overwriting a published image.')
              } else {
                core.info('Tag already exists on this commit, rebuilding.')
              }
            }
  build-docker-images:
    runs-on: ubuntu-latest
    needs: create-tag
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: blitzbrowser
            image_suffix: blitzbrowser
            dockerfile: ./blitzbrowser/Dockerfile
            context: ./blitzbrowser
          # dashboard image intentionally not built — not deployed; upstream pnpm lockfile fails --frozen-lockfile.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - id: package_version
        run: echo "VERSION=$(node -p "require('./blitzbrowser/package.json').version")" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Runs only on main (create-tag). Deploy by the version tag, not latest.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_suffix }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_suffix }}:${{ steps.package_version.outputs.VERSION }}